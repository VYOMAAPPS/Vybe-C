name: Build VYBE debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The project signs debug builds with ~/.android/debug.keystore; create it on the runner.
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: bash ./gradlew :app:assembleFossDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VYBE-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
